version: '3'

# The controller's own OPM module, modules/opm_controller (opmodel.dev/modules/opm_controller@v0).
# Its CRD and RBAC data are generated from config/ with `cue import`
# (hack/controller-module/generate.sh); the drift check keeps them equal.
# Both scripts need a `cue` CLI at CI's CUE_VERSION (.github/workflows/test.yml),
# since `cue import` formatting is part of the compared bytes.

tasks:
  generate:
    desc: Regenerate the controller module's CRD and RBAC data from config/ (dev:manifests runs it)
    cmds:
      - hack/controller-module/generate.sh

  drift:
    desc: 'Fail when the controller module''s CUE is not cue fmt clean, when config/ is stale against dev:manifests, then when the module''s generated data are stale against config/. REF=<tag> checks the data against that ref''s config/ instead (no manifests stage).'
    cmds:
      - task: fmt:check
      - task: drift:manifests
        if: '[ -z "{{.REF}}" ]'
      - cmd: hack/controller-module/drift-check.sh
        if: '[ -z "{{.REF}}" ]'
      - cmd: hack/controller-module/drift-check.sh --ref "{{.REF}}"
        if: '[ -n "{{.REF}}" ]'
    vars:
      REF: '{{.REF | default ""}}'

  drift:manifests:
    internal: true
    cmds:
      - task: :dev:manifests:config
      - |
        stale=$( { git diff --name-only -- config/crd/bases config/rbac/role.yaml;
          git ls-files --others --exclude-standard -- config/crd/bases; } )
        if [ -n "$stale" ]; then
          echo "DRIFT: config/ is stale against 'task dev:manifests' (differs from the index):"
          echo "$stale" | sed 's/^/  /'
          git --no-pager diff -- config/crd/bases config/rbac/role.yaml | head -80
          echo "run 'task dev:manifests' and commit the result" >&2
          exit 1
        fi

  release-check:
    desc: 'The controller module''s release gate for VERSION=<X.Y.Z> (the module''s release PR and its publish job): no dev pin or local-module.cue, identity.Version = VERSION on the path''s major, a published controller image at the digest GHCR serves, at or above min-controller-version, CRDs and RBAC equal to config/ at that tag. Needs gh (GH_REPO), docker buildx and the controller tags.'
    requires:
      vars: [VERSION]
    cmds:
      - hack/controller-module/release-check.sh "{{.VERSION}}"

  release-check:test:
    desc: Offline test of the controller module's release gate over fixture trees (hack/testdata/controller-module-release-check)
    cmds:
      - hack/controller-module/test-release-check.sh

  publish:test:
    desc: Offline test of the controller module's publish script (hack/controller-module/publish.sh) against stub opm and crane; asserts the GHCR reference CUE resolves for the module path
    cmds:
      - hack/controller-module/test-publish.sh

  image:test:
    desc: Offline test of the controller module's image PR script (hack/controller-module/image.sh) over fixture CHANGELOGs and CRDs (hack/testdata/controller-module-image)
    cmds:
      - hack/controller-module/test-image.sh

  bot-pr:test:
    desc: Offline test of the controller module's bot PR script (hack/controller-module/bot-pr.sh) against a scratch origin and a stub gh
    cmds:
      - hack/controller-module/test-bot-pr.sh

  fmt:check:
    desc: Fail when a CUE file of the controller module is not cue fmt clean
    dir: modules/opm_controller
    cmds:
      - cue fmt --check ./...
