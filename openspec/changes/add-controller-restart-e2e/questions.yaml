    question: Which outcomes must the test check before it counts the resume after a restart as safe?
    options:
      a: Full check. Each rendered object keeps its UID (not recreated), the inventory equals the rendered set, no object with the instance UUID label is outside the inventory, and Ready=True with observedGeneration current.
      b: Convergence only. Ready=True with observedGeneration current, and the inventory is not empty.
      c: Full check plus events. As A, and also no Warning event (for example an ownership conflict) on the instance after the restart.
    recommended: a
    reason: The original design of this test names "no duplicate resources, inventory matches render output, no orphaned resources". The UID check is the only one that sees a delete and recreate. Events are noisy across a restart (PlatformNotReady is expected), so C risks a flaky test.
    predicted_answer: a
    predicted_outcome: The spec reads object UIDs before the staged crash and fails if any UID differs after the restart, or if the inventory and the labeled objects in the namespace differ.
    answer:
      choice: a
      text: null
      by: owner
      rule: null
      at: 2026-11-27T13:55:38Z
    thoughts: The owner wants the test to see a recreate, a missing take-in and an orphaned object, not only that Ready is reached.
