    asked: 2026-11-27T11:15:21Z
    question: How does the test put the controller into the crash window it proves recovery from?
    options:
      a: Staged crash state. Let the instance reach Ready, stop the controller, roll its status back to what it held before the apply (objects in the cluster, not in the inventory), start the controller, assert convergence. Optionally also a plain hard kill of a reconcile in flight as a smoke check.
      b: Timed hard kill only. Apply the instance, wait for Reconciling=True, force-delete the pod, assert convergence. Where in the reconcile the kill lands is luck.
      c: Fault-injection hook in the binary. A test-only flag or env makes the manager exit at a named point (after apply, before the status commit).
    recommended: a
    reason: The window that matters is "applied, but the status is not written" (the original design of this test). A hello reconcile runs in seconds, so a timed kill rarely lands there; staging the state hits it every run with no product code change.
    predicted_answer: a
    predicted_outcome: No product code change; the e2e spec fails if the restarted controller recreates an object (UID changes) or leaves an object outside the inventory.
    answer:
      choice: a
      text: null
      by: owner
      rule: null
      at: 2026-11-27T13:48:41Z
    thoughts: The owner takes the staged state as the core proof. Whether the optional hard-kill smoke check is part of the work is still open.
