    question: Besides the staged crash, does the test also kill a live controller pod while a reconcile runs?
    options:
      a: No. The staged crash only; the controller is stopped and started by scaling the Deployment to 0 and back to 1.
      b: Yes, a graceful pod delete. kubectl delete pod -l control-plane=manager while the instance reports Reconciling, then the full check from q2.
      c: Yes, a hard kill. kubectl delete pod with --grace-period=0 --force while the instance reports Reconciling, then the full check from q2.
    recommended: b
    reason: The idea names a pod kill and restart fixture, and the TODO in concurrent_test.go names kubectl delete pod. A graceful delete runs the real shutdown path (context cancel, skipped status commit) at low cost. A hard kill adds little over the staged crash, which already proves the no-commit window.
    predicted_answer: b
    predicted_outcome: One more It in the restart Describe; it adds about 30s (lease expiry of about 15s plus a hello reconcile) and passes with the same full check.
    answer:
