    question: When does the pod delete spec delete the pod, given that Reconciling=True may show for less than a poll interval?
    options:
      a: Wait up to 10s for Reconciling=True after the values change, then delete; delete anyway with a GinkgoWriter line when it does not show.
      b: Wait for Reconciling=True and fail the spec when it does not show.
      c: Delete right after the values change, with no wait.
    recommended: a
    reason: Keeps the owner's "while a reconcile runs" where the condition is seen, and never flakes on the race; the spec is a smoke check.
    predicted_outcome: The pod delete spec passes in task dev:e2e on every run, whether or not Reconciling=True was seen.
