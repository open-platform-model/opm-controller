    question: Does the test also prove that a prune that was pending at the crash still runs after the restart?
    options:
      a: Yes, with a staged stale entry. The test creates an extra ConfigMap with the instance's ownership labels and puts it into the staged inventory, as if an earlier render made it. After the restart it asserts that the ConfigMap is deleted.
      b: No. The test covers only the first-apply window (objects applied, inventory empty).
      c: Yes, with a real values change. A fixture whose render drops an object for one value; the test changes the value and stages the crash after that apply.
    recommended: a
    reason: The original design of this test names "skip prune" as a failure to catch. The stale set is the old inventory minus the new render (moduleinstance.go staleEntries), so a staged inventory entry reaches the same code with the hello fixture; C needs a new or bumped fixture.
    predicted_answer: a
    predicted_outcome: The spec fails if the extra ConfigMap still exists once the instance is Ready after the restart; no fixture change.
    answer:
